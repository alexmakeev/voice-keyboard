name: TestFlight

on:
  push:
    tags:
      - 'tf-v*'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  BUNDLE_ID: com.voice.keyborad.test
  DIST_IDENTITY: "Apple Distribution: Sergey Teplyakov (65628Q94KF)"
  INSTALLER_IDENTITY: "3rd Party Mac Developer Installer: Sergey Teplyakov (65628Q94KF)"

jobs:
  testflight:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Guard - tag must sit on ci/testflight-upload
        run: |
          git fetch --quiet origin ci/testflight-upload || true
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/ci/testflight-upload; then
            echo "::error::tf-v* tag must be placed on a commit from ci/testflight-upload"; exit 1
          fi
          echo "guard ok"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: testflight-arm64

      - name: Install deps
        run: brew install autoconf automake libtool opus pkg-config

      - name: Build voice-typer sidecar
        env:
          CFLAGS: "-march=armv8-a+dotprod"
          CXXFLAGS: "-march=armv8-a+dotprod"
        run: cargo build --release --bin voice-typer --features "whisper,opus"

      - name: Copy sidecar
        run: |
          mkdir -p src-tauri/binaries
          cp target/release/voice-typer "src-tauri/binaries/voice-typer-$(rustc -vV | grep host | cut -d' ' -f2)"

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked

      - name: Import App Store signing certs
        env:
          MAS_DIST_CERT_P12: ${{ secrets.MAS_DIST_CERT_P12 }}
          MAS_INSTALLER_CERT_P12: ${{ secrets.MAS_INSTALLER_CERT_P12 }}
          MAS_P12_PASSWORD: ${{ secrets.MAS_P12_PASSWORD }}
        run: |
          KC=$RUNNER_TEMP/tf.keychain
          security create-keychain -p "" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security default-keychain -s "$KC"
          security unlock-keychain -p "" "$KC"
          echo "$MAS_DIST_CERT_P12" | base64 --decode > "$RUNNER_TEMP/dist.p12"
          echo "$MAS_INSTALLER_CERT_P12" | base64 --decode > "$RUNNER_TEMP/inst.p12"
          security import "$RUNNER_TEMP/dist.p12" -k "$KC" -P "$MAS_P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/productbuild
          security import "$RUNNER_TEMP/inst.p12" -k "$KC" -P "$MAS_P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/productbuild
          security set-key-partition-list -S apple-tool:,apple: -s -k "" "$KC"
          security list-keychains -d user -s "$KC"
          echo "identities:"; security find-identity -v "$KC" || true

      - name: Install provisioning profile
        env:
          MAS_PROVISION_PROFILE: ${{ secrets.MAS_PROVISION_PROFILE }}
        run: |
          echo "$MAS_PROVISION_PROFILE" | base64 --decode > "$RUNNER_TEMP/embedded.provisionprofile"
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$RUNNER_TEMP/embedded.provisionprofile" "$HOME/Library/MobileDevice/Provisioning Profiles/voicekbd.provisionprofile"

      - name: Write MAS entitlements + config override
        run: |
          cat > src-tauri/entitlements.appstore.plist <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>com.apple.security.app-sandbox</key><true/>
            <key>com.apple.application-identifier</key><string>65628Q94KF.com.voice.keyborad.test</string>
            <key>com.apple.developer.team-identifier</key><string>65628Q94KF</string>
            <key>com.apple.security.device.audio-input</key><true/>
            <key>com.apple.security.network.client</key><true/>
            <key>com.apple.security.files.user-selected.read-only</key><true/>
          </dict></plist>
          PLIST
          cat > src-tauri/tauri.appstore.conf.json <<'CONF'
          { "identifier": "com.voice.keyborad.test",
            "bundle": {
              "category": "Productivity",
              "macOS": { "entitlements": "entitlements.appstore.plist", "minimumSystemVersion": "12.0" }
            } }
          CONF

      - name: Build Tauri app (App Store variant)
        env:
          APPLE_SIGNING_IDENTITY: ${{ env.DIST_IDENTITY }}
          CI: true
        run: |
          cargo tauri build --target aarch64-apple-darwin --bundles app \
            --config src-tauri/tauri.appstore.conf.json

      - name: Fix packaging (category, min version, 512@2x icon) + re-sign
        run: |
          APP="src-tauri/target/aarch64-apple-darwin/release/bundle/macos/Voice Keyboard.app"
          PLIST="$APP/Contents/Info.plist"
          # 1) app category + min system version (belt-and-suspenders vs tauri config)
          /usr/libexec/PlistBuddy -c "Set :LSApplicationCategoryType public.app-category.productivity" "$PLIST" 2>/dev/null \
            || /usr/libexec/PlistBuddy -c "Add :LSApplicationCategoryType string public.app-category.productivity" "$PLIST"
          /usr/libexec/PlistBuddy -c "Set :LSMinimumSystemVersion 12.0" "$PLIST" 2>/dev/null \
            || /usr/libexec/PlistBuddy -c "Add :LSMinimumSystemVersion string 12.0" "$PLIST"
          # 2) build a complete icns (includes 512x512@2x) from the 256px source, upscaled
          SRC="src-tauri/icons/icon.png"
          sips -z 1024 1024 "$SRC" --out "$RUNNER_TEMP/icon1024.png" >/dev/null
          ISET="$RUNNER_TEMP/AppIcon.iconset"; mkdir -p "$ISET"
          for s in 16 32 128 256 512; do
            sips -z $s $s "$RUNNER_TEMP/icon1024.png" --out "$ISET/icon_${s}x${s}.png" >/dev/null
            d=$((s*2)); sips -z $d $d "$RUNNER_TEMP/icon1024.png" --out "$ISET/icon_${s}x${s}@2x.png" >/dev/null
          done
          iconutil -c icns "$ISET" -o "$RUNNER_TEMP/AppIcon.icns"
          ICNS=$(ls "$APP/Contents/Resources/"*.icns 2>/dev/null | head -1)
          if [ -n "$ICNS" ]; then cp "$RUNNER_TEMP/AppIcon.icns" "$ICNS"; echo "replaced $ICNS";
          else cp "$RUNNER_TEMP/AppIcon.icns" "$APP/Contents/Resources/icon.icns";
            /usr/libexec/PlistBuddy -c "Set :CFBundleIconFile icon" "$PLIST" 2>/dev/null \
              || /usr/libexec/PlistBuddy -c "Add :CFBundleIconFile string icon" "$PLIST"; echo "added icon.icns"; fi
          # 3) unique build number
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $GITHUB_RUN_NUMBER" "$PLIST" || true
          # 4) sidecar entitlements WITHOUT application-identifier (fix 90885)
          cat > src-tauri/entitlements.sidecar.plist <<'SP'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>com.apple.security.app-sandbox</key><true/>
            <key>com.apple.security.inherit</key><true/>
          </dict></plist>
          SP
          # 5) embed profile (main app only) + sign INSIDE-OUT (no --deep, so sidecar keeps its own entitlements)
          cp "$RUNNER_TEMP/embedded.provisionprofile" "$APP/Contents/embedded.provisionprofile"
          while IFS= read -r f; do
            if file "$f" | grep -q "Mach-O"; then codesign --force --sign "$DIST_IDENTITY" "$f" || true; fi
          done < <(find "$APP/Contents/Frameworks" "$APP/Contents/Resources" -type f 2>/dev/null)
          SIDECAR="$APP/Contents/MacOS/voice-typer"
          [ -f "$SIDECAR" ] && codesign --force --sign "$DIST_IDENTITY" --entitlements src-tauri/entitlements.sidecar.plist "$SIDECAR"
          codesign --force --sign "$DIST_IDENTITY" --entitlements src-tauri/entitlements.appstore.plist "$APP"
          codesign --verify --strict "$APP" || true
          echo "=== app entitlements ==="; codesign -d --entitlements - "$APP" || true
          echo "=== sidecar entitlements ==="; codesign -d --entitlements - "$SIDECAR" || true

      - name: Build signed .pkg
        run: |
          APP="src-tauri/target/aarch64-apple-darwin/release/bundle/macos/Voice Keyboard.app"
          mkdir -p dist
          productbuild --component "$APP" /Applications \
            --sign "$INSTALLER_IDENTITY" dist/VoiceKeyboard.pkg
          echo "=== pkg signature ==="; pkgutil --check-signature dist/VoiceKeyboard.pkg || true

      - name: Prepare ASC API key
        env:
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
        run: |
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          echo "$ASC_API_KEY_P8" | base64 --decode > "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_API_KEY_ID}.p8"

      - name: Validate + upload to TestFlight
        env:
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_ISSUER: ${{ secrets.ASC_API_ISSUER }}
        run: |
          set +e
          echo "=================== altool --validate-app ==================="
          xcrun altool --validate-app -f dist/VoiceKeyboard.pkg -t macos \
            --apiKey "$ASC_API_KEY_ID" --apiIssuer "$ASC_API_ISSUER" 2>&1 | tee validate.log
          echo "=================== altool --upload-app ==================="
          xcrun altool --upload-app -f dist/VoiceKeyboard.pkg -t macos \
            --apiKey "$ASC_API_KEY_ID" --apiIssuer "$ASC_API_ISSUER" 2>&1 | tee upload.log
          echo "=================== DONE: Apple response captured above ==================="

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: testflight-logs
          path: |
            validate.log
            upload.log
