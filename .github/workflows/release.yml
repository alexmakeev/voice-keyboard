name: Release

on:
  push:
    tags:
      - 'v*'

env:
  CARGO_TERM_COLOR: always

jobs:
  # Windows CLI build with launcher + core app
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: windows-release

      # Build core app (voice-typer) with all features
      - name: Build voice-typer
        run: cargo build --release --bin voice-typer --features "whisper,opus,gui,updater" --target x86_64-pc-windows-msvc

      # Build launcher
      - name: Build launcher
        run: cargo build --release --bin voice-typer-launcher --features "updater" --target x86_64-pc-windows-msvc

      # Test binaries
      - name: Test binaries
        shell: bash
        run: |
          ./target/x86_64-pc-windows-msvc/release/voice-typer.exe --help
          ./target/x86_64-pc-windows-msvc/release/voice-typer-launcher.exe --help || true

      # Prepare artifacts
      - name: Prepare artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist

          # Copy both executables
          Copy-Item "target/x86_64-pc-windows-msvc/release/voice-typer.exe" -Destination "dist/"
          Copy-Item "target/x86_64-pc-windows-msvc/release/voice-typer-launcher.exe" -Destination "dist/"

          # Copy docs
          Copy-Item "README.md" -Destination "dist/" -ErrorAction SilentlyContinue
          Copy-Item "LICENSE" -Destination "dist/"

          # Create zip
          Compress-Archive -Path "dist/*" -DestinationPath "voice-typer-x86_64-pc-windows-msvc.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: voice-typer-x86_64-pc-windows-msvc
          path: voice-typer-x86_64-pc-windows-msvc.zip

  # Windows ARM64 CLI build with launcher + core app
  build-windows-arm:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-pc-windows-msvc

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: windows-arm-release

      # Build core app (voice-typer) with all features
      - name: Build voice-typer
        run: cargo build --release --bin voice-typer --features "whisper,opus,gui,updater" --target aarch64-pc-windows-msvc

      # Build launcher
      - name: Build launcher
        run: cargo build --release --bin voice-typer-launcher --features "updater" --target aarch64-pc-windows-msvc

      # Skip testing — cannot run ARM64 binaries on x64 runner
      - name: Test binaries
        shell: bash
        run: |
          echo "Skipping tests - cannot run ARM64 binaries on x64 runner"

      # Prepare artifacts
      - name: Prepare artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist

          # Copy both executables
          Copy-Item "target/aarch64-pc-windows-msvc/release/voice-typer.exe" -Destination "dist/"
          Copy-Item "target/aarch64-pc-windows-msvc/release/voice-typer-launcher.exe" -Destination "dist/"

          # Copy docs
          Copy-Item "README.md" -Destination "dist/" -ErrorAction SilentlyContinue
          Copy-Item "LICENSE" -Destination "dist/"

          # Create zip
          Compress-Archive -Path "dist/*" -DestinationPath "voice-typer-aarch64-pc-windows-msvc.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: voice-typer-aarch64-pc-windows-msvc
          path: voice-typer-aarch64-pc-windows-msvc.zip

  # Windows Tauri GUI app (NSIS installer)
  build-tauri-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: windows-tauri

      - name: Build voice-typer sidecar
        run: cargo build --release --bin voice-typer --features "whisper,opus" --target x86_64-pc-windows-msvc

      - name: Copy sidecar binary
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path src-tauri/binaries
          Copy-Item "target/x86_64-pc-windows-msvc/release/voice-typer.exe" -Destination "src-tauri/binaries/voice-typer-x86_64-pc-windows-msvc.exe"

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked

      - name: Build Tauri app
        run: cargo tauri build --target x86_64-pc-windows-msvc

      - name: Upload NSIS installer
        uses: actions/upload-artifact@v5
        with:
          name: voice-keyboard-windows-x64-setup
          path: src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe

  # Windows ARM64 Tauri GUI app (NSIS installer)
  build-tauri-windows-arm:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-pc-windows-msvc

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: windows-arm-tauri

      - name: Build voice-typer sidecar
        run: cargo build --release --bin voice-typer --features "whisper,opus" --target aarch64-pc-windows-msvc

      - name: Copy sidecar binary
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path src-tauri/binaries
          Copy-Item "target/aarch64-pc-windows-msvc/release/voice-typer.exe" -Destination "src-tauri/binaries/voice-typer-aarch64-pc-windows-msvc.exe"

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked

      - name: Build Tauri app
        run: cargo tauri build --target aarch64-pc-windows-msvc

      - name: Upload NSIS installer
        uses: actions/upload-artifact@v5
        with:
          name: voice-keyboard-windows-arm64-setup
          path: src-tauri/target/aarch64-pc-windows-msvc/release/bundle/nsis/*.exe

  # macOS Tauri GUI app (DMG)
  build-tauri-macos:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: macos-tauri

      - name: Install autotools
        run: brew install autoconf automake libtool

      - name: Build voice-typer sidecar
        env:
          CFLAGS: "-march=armv8-a+dotprod"
          CXXFLAGS: "-march=armv8-a+dotprod"
        run: cargo build --release --bin voice-typer --features "whisper,opus"

      - name: Copy sidecar binary
        run: |
          mkdir -p src-tauri/binaries
          cp target/release/voice-typer "src-tauri/binaries/voice-typer-$(rustc -vV | grep host | cut -d' ' -f2)"

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked

      - name: Build Tauri app
        run: cargo tauri build --features macos-private-api

      - name: Upload DMG
        uses: actions/upload-artifact@v5
        with:
          name: voice-keyboard-macos-dmg
          path: src-tauri/target/release/bundle/dmg/*.dmg

  # macOS build with Tauri DMG + standalone binary
  build-macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
            arch: arm64
            features: "whisper,metal"
          - os: macos-15-intel
            target: x86_64-apple-darwin
            arch: x64
            features: "whisper"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ matrix.os }}-cargo-release-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ matrix.os }}-cargo-release-

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked

      - name: Build voice-typer
        run: cargo build --release --bin voice-typer --features "${{ matrix.features }}" --target ${{ matrix.target }}

      - name: Package voice-typer binary
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/voice-typer dist/
          cd dist && zip voice-typer-macos-${{ matrix.arch }}.zip voice-typer

      - name: Prepare sidecar binary
        run: |
          mkdir -p src-tauri/binaries
          cp target/${{ matrix.target }}/release/voice-typer src-tauri/binaries/voice-typer-${{ matrix.target }}

      - name: Build Tauri DMG
        run: cargo tauri build --target ${{ matrix.target }} --bundles dmg
        env:
          APPLE_SIGNING_IDENTITY: "-"
          CI: true

      - name: Rename DMG
        run: |
          mkdir -p dist
          mv target/${{ matrix.target }}/release/bundle/dmg/*.dmg dist/voice-keyboard-macos-${{ matrix.arch }}.dmg

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}
          path: dist/*

  # Create GitHub Release
  release:
    needs: [build-windows, build-windows-arm, build-tauri-windows, build-tauri-windows-arm, build-tauri-macos, build-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout (for changelog)
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download Windows artifacts
        uses: actions/download-artifact@v6
        with:
          name: voice-typer-windows-x64
          path: artifacts/

      - name: Download macOS ARM64 artifacts
        uses: actions/download-artifact@v6
        with:
          name: macos-arm64
          path: artifacts/

      - name: Download macOS x64 artifacts
        uses: actions/download-artifact@v6
        with:
          name: macos-x64
          path: artifacts/

      - name: List artifacts
        run: find artifacts -type f -ls

      - name: Prepare release files
        run: |
          mkdir -p release
          find artifacts -type f \( -name "*.zip" -o -name "*.dmg" -o -name "*.exe" \) -exec cp {} release/ \;
          echo "=== Release files ==="
          ls -la release/

      - name: Generate checksums
        run: |
          cd artifacts
          sha256sum *.zip *.dmg > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PRERELEASE=""
          if echo "${{ github.ref_name }}" | grep -qE "(alpha|beta|rc)"; then
            PRERELEASE="--prerelease"
          fi
          gh release create ${{ github.ref_name }} \
            artifacts/*.zip \
            artifacts/*.dmg \
            artifacts/SHA256SUMS.txt \
            --title "Release ${{ github.ref_name }}" \
            --notes-file - \
            $PRERELEASE << 'BODY'
          ## Downloads

          ### macOS
          - **Apple Silicon (M1/M2/M3/M4):** `voice-keyboard-macos-arm64.dmg`
          - **Intel Mac:** `voice-keyboard-macos-x64.dmg`

          > Note: The DMG is unsigned. On first launch, right-click → Open, or go to System Preferences → Privacy & Security → Open Anyway.

          ### Windows
          - **Windows x64:** `voice-keyboard-windows-x64.zip`

          ### Standalone voice-typer binary
          - `voice-typer-macos-arm64.zip`
          - `voice-typer-macos-x64.zip`
          - `voice-typer-windows-x64.zip`

          ## Checksums
          See `SHA256SUMS.txt` for file integrity verification.
          BODY
