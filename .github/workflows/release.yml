name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build only, skip publishing a GitHub Release"
        type: boolean
        default: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # Windows CLI build with launcher + core app
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: windows-release

      # Build core app (voice-typer) with all features
      - name: Build voice-typer
        run: cargo build --release --bin voice-typer --features "whisper,opus,gui,updater" --target x86_64-pc-windows-msvc

      # Build launcher
      - name: Build launcher
        run: cargo build --release --bin voice-typer-launcher --features "updater" --target x86_64-pc-windows-msvc

      # Test binaries
      - name: Test binaries
        shell: bash
        run: |
          ./target/x86_64-pc-windows-msvc/release/voice-typer.exe --help
          ./target/x86_64-pc-windows-msvc/release/voice-typer-launcher.exe --help || true

      # Prepare artifacts
      - name: Prepare artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist

          # Copy both executables
          Copy-Item "target/x86_64-pc-windows-msvc/release/voice-typer.exe" -Destination "dist/"
          Copy-Item "target/x86_64-pc-windows-msvc/release/voice-typer-launcher.exe" -Destination "dist/"

          # Copy docs
          Copy-Item "README.md" -Destination "dist/" -ErrorAction SilentlyContinue
          Copy-Item "LICENSE" -Destination "dist/"

          # Create zip
          Compress-Archive -Path "dist/*" -DestinationPath "voice-typer-x86_64-pc-windows-msvc.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: voice-typer-x86_64-pc-windows-msvc
          path: voice-typer-x86_64-pc-windows-msvc.zip

  # Windows Tauri GUI app (NSIS installer)
  build-tauri-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: windows-tauri

      - name: Build voice-typer sidecar
        run: cargo build --release --bin voice-typer --features "whisper,opus" --target x86_64-pc-windows-msvc

      - name: Copy sidecar binary
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path src-tauri/binaries
          Copy-Item "target/x86_64-pc-windows-msvc/release/voice-typer.exe" -Destination "src-tauri/binaries/voice-typer-x86_64-pc-windows-msvc.exe"

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked

      - name: Build Tauri app
        run: cargo tauri build --target x86_64-pc-windows-msvc

      - name: Upload NSIS installer
        uses: actions/upload-artifact@v5
        with:
          name: voice-keyboard-windows-x64-setup
          path: src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe

  # macOS Tauri GUI app (DMG)
  build-tauri-macos:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: macos-tauri

      - name: Install macOS dependencies
        run: brew install autoconf automake libtool opus pkg-config

      - name: Build voice-typer sidecar
        env:
          CFLAGS: "-march=armv8-a+dotprod"
          CXXFLAGS: "-march=armv8-a+dotprod"
        run: cargo build --release --bin voice-typer --features "whisper,opus"

      - name: Copy sidecar binary
        run: |
          mkdir -p src-tauri/binaries
          cp target/release/voice-typer "src-tauri/binaries/voice-typer-$(rustc -vV | grep host | cut -d' ' -f2)"

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked

      - name: Build Tauri app
        run: cargo tauri build --features macos-private-api

      - name: Upload DMG
        uses: actions/upload-artifact@v5
        with:
          name: voice-keyboard-macos-dmg
          path: src-tauri/target/release/bundle/dmg/*.dmg

  # macOS build with Tauri DMG + standalone binary
  build-macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
            arch: arm64
            features: "whisper,metal,opus"
          - os: macos-15-intel
            target: x86_64-apple-darwin
            arch: x64
            features: "whisper,opus"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}-release

      - name: Install macOS dependencies
        run: brew install opus pkg-config

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked

      - name: Build voice-typer
        run: cargo build --release --bin voice-typer --features "${{ matrix.features }}" --target ${{ matrix.target }}

      - name: Package voice-typer binary
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/voice-typer dist/
          cd dist && zip voice-typer-macos-${{ matrix.arch }}.zip voice-typer

      - name: Prepare sidecar binary
        run: |
          mkdir -p src-tauri/binaries
          cp target/${{ matrix.target }}/release/voice-typer src-tauri/binaries/voice-typer-${{ matrix.target }}

      - name: Import signing certificate
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/build.keychain
          security create-keychain -p "" $KEYCHAIN_PATH
          # Disable auto-lock: the default 5-minute keychain timeout can expire
          # mid-build (cargo tauri build compiles Rust + bundles the app), and a
          # headless CI session cannot answer the resulting re-unlock prompt --
          # codesign then hangs indefinitely instead of failing. 21600s = 6h
          # matches the GitHub Actions job time limit.
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security default-keychain -s $KEYCHAIN_PATH
          security unlock-keychain -p "" $KEYCHAIN_PATH
          echo "$APPLE_CERTIFICATE" | base64 --decode > $RUNNER_TEMP/certificate.p12
          security import $RUNNER_TEMP/certificate.p12 -k $KEYCHAIN_PATH \
            -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "" $KEYCHAIN_PATH
          # Ensure codesign can actually locate the identity at sign-time: setting
          # the default keychain does not add it to the search list that
          # codesign/productbuild query.
          security list-keychains -d user -s $KEYCHAIN_PATH

      # Notarization uses the App Store Connect API key method (APPLE_API_KEY /
      # APPLE_API_KEY_ID / APPLE_API_ISSUER below). The APPLE_TEAM_ID secret
      # configured on this repo is unused by this workflow -- it belongs to the
      # older Apple-ID + app-specific-password notarization method, not this one.
      - name: Prepare API key for notarization
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
        run: |
          echo "$APPLE_API_KEY" | base64 --decode > $RUNNER_TEMP/AuthKey.p8

      - name: Build Tauri app bundle
        run: cargo tauri build --target ${{ matrix.target }} --bundles app
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          CI: true

      - name: Re-sign app bundle with entitlements
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          APP="src-tauri/target/${{ matrix.target }}/release/bundle/macos/Voice Keyboard.app"
          SIDECAR="${APP}/Contents/MacOS/voice-typer"
          ENTITLEMENTS="src-tauri/entitlements.plist"
          codesign --force --sign "$APPLE_SIGNING_IDENTITY" --entitlements "${ENTITLEMENTS}" --options runtime "${SIDECAR}"
          codesign --force --deep --sign "$APPLE_SIGNING_IDENTITY" --entitlements "${ENTITLEMENTS}" --options runtime "${APP}"
          codesign --verify --deep --strict "${APP}"
          codesign -d --entitlements - "${APP}"

      - name: Package DMG from signed app
        run: |
          set -euo pipefail
          APP="src-tauri/target/${{ matrix.target }}/release/bundle/macos/Voice Keyboard.app"
          VOLNAME="Voice Keyboard"
          STAGING="$RUNNER_TEMP/dmg-staging"
          RW_DMG="$RUNNER_TEMP/voice-keyboard-rw.dmg"
          FINAL_DMG="dist/voice-keyboard-macos-${{ matrix.arch }}.dmg"

          mkdir -p dist
          rm -rf "$STAGING"
          mkdir -p "$STAGING"

          # Standard drag-to-install layout: app + Applications shortcut side by side
          cp -R "$APP" "$STAGING/"
          ln -s /Applications "$STAGING/Applications"

          # Build a writable image sized to the staged contents, then lay out
          # the Finder window/icons the same way Tauri's own dmg bundler does
          # (see src-tauri/tauri.conf.json bundle.macOS.dmg for the matching values).
          rm -f "$RW_DMG"
          hdiutil create -volname "$VOLNAME" -srcfolder "$STAGING" -ov -format UDRW -fs HFS+ "$RW_DMG"

          MOUNT_DIR=$(hdiutil attach -readwrite -noverify -noautoopen -plist "$RW_DMG" | python3 -c "
          import plistlib, sys
          d = plistlib.loads(sys.stdin.buffer.read())
          for e in d['system-entities']:
              if 'mount-point' in e:
                  print(e['mount-point'])
                  break
          ")
          MOUNTED_VOLNAME=$(basename "$MOUNT_DIR")

          # Built as a quoted variable (not a heredoc): a heredoc's closing
          # delimiter must start at column 0, which is less indented than this
          # YAML block scalar's content -- that prematurely ends the `run: |`
          # block and breaks parsing of the whole workflow file.
          APPLESCRIPT='tell application "Finder"
            tell disk "'"$MOUNTED_VOLNAME"'"
              open
              set current view of container window to icon view
              set toolbar visible of container window to false
              set statusbar visible of container window to false
              set the bounds of container window to {100, 100, 760, 500}
              set theViewOptions to the icon view options of container window
              set arrangement of theViewOptions to not arranged
              set icon size of theViewOptions to 128
              set position of item "Voice Keyboard.app" of container window to {180, 170}
              set position of item "Applications" of container window to {480, 170}
              close
              open
              update without registering applications
              delay 1
            end tell
          end tell'
          osascript -e "$APPLESCRIPT"

          hdiutil detach "$MOUNT_DIR"
          hdiutil convert "$RW_DMG" -format UDZO -ov -o "$FINAL_DMG"
          rm -f "$RW_DMG"

      - name: Notarize DMG
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          DMG="dist/voice-keyboard-macos-${{ matrix.arch }}.dmg"
          API_KEY_PATH="$RUNNER_TEMP/AuthKey.p8"
          for attempt in 1 2 3; do
            echo "Notarization attempt $attempt of 3..."
            # --timeout caps how long --wait polls Apple's service: without it, a
            # single slow/stuck submission can consume the entire 6h job budget,
            # leaving the retry loop below no chance to ever retry.
            # --output-format json gives a reliable submission id/status to parse
            # (instead of scraping the human-readable "normal" output), so we can
            # fetch the detailed rejection log below on failure.
            set +e
            SUBMIT_OUTPUT=$(xcrun notarytool submit "$DMG" \
              --key "$API_KEY_PATH" \
              --key-id "$APPLE_API_KEY_ID" \
              --issuer "$APPLE_API_ISSUER" \
              --wait \
              --timeout 15m \
              --output-format json)
            SUBMIT_EXIT=$?
            set -e
            echo "$SUBMIT_OUTPUT"
            SUBMISSION_ID=$(echo "$SUBMIT_OUTPUT" | jq -r '.id // empty' 2>/dev/null)
            SUBMIT_STATUS=$(echo "$SUBMIT_OUTPUT" | jq -r '.status // empty' 2>/dev/null)

            if [ "$SUBMIT_EXIT" -eq 0 ] && [ "$SUBMIT_STATUS" = "Accepted" ]; then
              echo "Notarization succeeded on attempt $attempt"
              break
            fi

            echo "Notarization attempt $attempt failed (exit=$SUBMIT_EXIT, status=${SUBMIT_STATUS:-unknown})"
            if [ -n "$SUBMISSION_ID" ]; then
              echo "Fetching Apple's notarization log for submission $SUBMISSION_ID..."
              xcrun notarytool log "$SUBMISSION_ID" \
                --key "$API_KEY_PATH" \
                --key-id "$APPLE_API_KEY_ID" \
                --issuer "$APPLE_API_ISSUER" || echo "Could not fetch notarization log"
            else
              echo "No submission id available (submission likely never reached Apple's service)"
            fi

            if [ $attempt -eq 3 ]; then
              echo "Notarization failed after 3 attempts"
              exit 1
            fi
            echo "Retrying in 30 seconds..."
            sleep 30
          done
          xcrun stapler staple "$DMG"

      - name: Cleanup signing artifacts
        if: always()
        run: |
          security delete-keychain $RUNNER_TEMP/build.keychain || true
          rm -f $RUNNER_TEMP/certificate.p12 $RUNNER_TEMP/AuthKey.p8

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}
          path: dist/*

  # Create GitHub Release
  release:
    if: github.event_name == 'push' || inputs.dry_run == false
    needs: [build-windows, build-tauri-windows, build-tauri-macos, build-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout (for changelog)
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download Windows CLI artifacts
        uses: actions/download-artifact@v6
        with:
          name: voice-typer-x86_64-pc-windows-msvc
          path: artifacts/

      - name: Download Windows installer artifacts
        uses: actions/download-artifact@v6
        with:
          name: voice-keyboard-windows-x64-setup
          path: artifacts/

      - name: Download macOS ARM64 artifacts
        uses: actions/download-artifact@v6
        with:
          name: macos-arm64
          path: artifacts/

      - name: Download macOS x64 artifacts
        uses: actions/download-artifact@v6
        with:
          name: macos-x64
          path: artifacts/

      - name: List artifacts
        run: find artifacts -type f -ls

      - name: Prepare release files
        run: |
          mkdir -p release
          find artifacts -type f \( -name "*.zip" -o -name "*.dmg" -o -name "*.exe" \) -exec cp {} release/ \;
          echo "=== Release files ==="
          ls -la release/

      - name: Generate checksums
        run: |
          cd artifacts
          sha256sum *.zip *.dmg > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PRERELEASE=""
          if echo "${{ github.ref_name }}" | grep -qE "(alpha|beta|rc)"; then
            PRERELEASE="--prerelease"
          fi
          gh release create ${{ github.ref_name }} \
            artifacts/*.zip \
            artifacts/*.dmg \
            artifacts/SHA256SUMS.txt \
            --title "Release ${{ github.ref_name }}" \
            --notes-file - \
            $PRERELEASE << 'BODY'
          ## Downloads

          ### macOS
          - **Apple Silicon (M1/M2/M3/M4):** `voice-keyboard-macos-arm64.dmg`
          - **Intel Mac:** `voice-keyboard-macos-x64.dmg`

          > Note: The DMG is unsigned. On first launch, right-click → Open, or go to System Preferences → Privacy & Security → Open Anyway.

          ### Windows
          - **Windows x64:** `voice-typer-x86_64-pc-windows-msvc.zip`

          ### Standalone voice-typer binary
          - `voice-typer-macos-arm64.zip`
          - `voice-typer-macos-x64.zip`
          - `voice-typer-x86_64-pc-windows-msvc.zip`

          ## Checksums
          See `SHA256SUMS.txt` for file integrity verification.
          BODY
