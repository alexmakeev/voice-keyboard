name: CI

on:
  push:
    branches: [main, gui, develop]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  # Quick check on all platforms
  check:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            features: "whisper,opus"
          - os: macos-14
            features: "whisper,metal,opus"
          - os: macos-15-intel
            features: "whisper,opus"
          - os: windows-latest
            features: "whisper,opus"

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v6

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev \
            libxdo-dev \
            libx11-dev \
            libxtst-dev \
            libevdev-dev \
            libopus-dev \
            pkg-config

      - name: Install macOS dependencies
        if: startsWith(matrix.os, 'macos')
        run: brew install opus pkg-config

      - name: Check
        run: cargo check --bin voice-typer --features "${{ matrix.features }}"

      - name: Check formatting
        run: cargo fmt --check
        continue-on-error: true

      - name: Clippy
        run: cargo clippy --bin voice-typer --features "${{ matrix.features }}" -- -D warnings
        continue-on-error: true

      - name: Check version consistency
        if: matrix.os == 'ubuntu-22.04'
        run: |
          ROOT_VER=$(grep -m1 '^version' Cargo.toml | sed 's/.*"\(.*\)"/\1/')
          TAURI_CARGO_VER=$(grep -m1 '^version' src-tauri/Cargo.toml | sed 's/.*"\(.*\)"/\1/')
          TAURI_CONF_VER=$(python3 -c "import json; print(json.load(open('src-tauri/tauri.conf.json'))['version'])")
          echo "Root: $ROOT_VER, Tauri Cargo: $TAURI_CARGO_VER, Tauri conf: $TAURI_CONF_VER"
          if [ "$ROOT_VER" != "$TAURI_CARGO_VER" ] || [ "$ROOT_VER" != "$TAURI_CONF_VER" ]; then
            echo "ERROR: Version mismatch! All versions must match."
            exit 1
          fi
          echo "Versions are consistent: $ROOT_VER"

  # Build and test on all platforms
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            features: "whisper,opus"
          - os: macos-14
            target: aarch64-apple-darwin
            features: "whisper,metal,opus"
          - os: macos-15-intel
            target: x86_64-apple-darwin
            features: "whisper,opus"
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            features: "whisper,opus"

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v6

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev \
            libxdo-dev \
            libx11-dev \
            libxtst-dev \
            libevdev-dev \
            libopus-dev \
            pkg-config

      - name: Install macOS dependencies
        if: startsWith(matrix.os, 'macos')
        run: brew install opus pkg-config

      - name: Build
        env:
          CFLAGS: ${{ startsWith(matrix.target, 'aarch64') && '-march=armv8-a+dotprod' || '' }}
          CXXFLAGS: ${{ startsWith(matrix.target, 'aarch64') && '-march=armv8-a+dotprod' || '' }}
        run: cargo build --release --bin voice-typer --features "${{ matrix.features }}" --target ${{ matrix.target }}

      - name: Run unit tests
        run: cargo test --features "${{ matrix.features }}" --target ${{ matrix.target }}
        continue-on-error: true

      - name: Test binary runs
        shell: bash
        run: |
          if [[ "${{ matrix.os }}" == "windows-latest" ]]; then
            ./target/${{ matrix.target }}/release/voice-typer.exe --help
          else
            ./target/${{ matrix.target }}/release/voice-typer --help
          fi

  # Integration test with Whisper model (Linux + macOS — Linux builds without AVX2)
  integration-test:
    needs: [check]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            features: "whisper,opus"
          - os: macos-14
            target: aarch64-apple-darwin
            features: "whisper,metal,opus"
          - os: macos-15-intel
            target: x86_64-apple-darwin
            features: "whisper,opus"

    runs-on: ${{ matrix.os }}

    env:
      CI_REQUIRE_MODEL: "1"
      MODEL_PATH: ./models/ggml-tiny.bin

    steps:
      - uses: actions/checkout@v6

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}-integration-noavx

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev \
            libxdo-dev \
            libx11-dev \
            libxtst-dev \
            libevdev-dev \
            libopus-dev \
            pkg-config

      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        run: brew install opus pkg-config

      - name: Cache Whisper model
        uses: actions/cache@v4
        with:
          path: models/ggml-tiny.bin
          key: whisper-model-tiny-v1

      - name: Download tiny Whisper model
        run: |
          if [ ! -f models/ggml-tiny.bin ]; then
            mkdir -p models
            curl -L -o models/ggml-tiny.bin \
              https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-tiny.bin
          fi

      - name: Build
        env:
          CMAKE_C_FLAGS: ${{ runner.os == 'Linux' && '-mno-avx2 -mno-avx -mno-fma -mno-f16c' || '' }}
          CMAKE_CXX_FLAGS: ${{ runner.os == 'Linux' && '-mno-avx2 -mno-avx -mno-fma -mno-f16c' || '' }}
        run: cargo build --release --bin voice-typer --features "${{ matrix.features }}" --target ${{ matrix.target }}

      - name: Run integration tests
        env:
          CMAKE_C_FLAGS: ${{ runner.os == 'Linux' && '-mno-avx2 -mno-avx -mno-fma -mno-f16c' || '' }}
          CMAKE_CXX_FLAGS: ${{ runner.os == 'Linux' && '-mno-avx2 -mno-avx -mno-fma -mno-f16c' || '' }}
        run: cargo test --test whisper_test --features "${{ matrix.features }}" --target ${{ matrix.target }} -- --nocapture

      - name: Verify model loads
        shell: bash
        run: |
          # Quick test that model can be loaded (will fail on hotkey, but that's OK)
          perl -e 'alarm(5); exec @ARGV' -- ./target/${{ matrix.target }}/release/voice-typer --model tiny 2>&1 | head -20 || true
          echo "Model loading test completed"

  # Build Tauri app for macOS
  build-tauri-macos:
    needs: [check]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
            features: "whisper,metal,opus"
          - os: macos-15-intel
            target: x86_64-apple-darwin
            features: "whisper,opus"

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}-tauri

      - name: Install macOS dependencies
        run: brew install opus pkg-config

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked

      - name: Build voice-typer binary
        run: cargo build --release --bin voice-typer --features "${{ matrix.features }}" --target ${{ matrix.target }}

      - name: Prepare sidecar binary
        run: |
          mkdir -p src-tauri/binaries
          cp target/${{ matrix.target }}/release/voice-typer src-tauri/binaries/voice-typer-${{ matrix.target }}

      - name: Build Tauri app
        run: cargo tauri build --target ${{ matrix.target }} --bundles dmg
        env:
          APPLE_SIGNING_IDENTITY: "-"
          CI: true

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: tauri-dmg-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/bundle/dmg/*.dmg
