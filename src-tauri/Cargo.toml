[package]
name = "voice-keyboard-app"
version = "0.5.1"
description = "Voice Keyboard - Speech to text with local Whisper"
authors = ["Alex Mak"]
license = "MIT"
repository = "https://github.com/alexmakeev/voice-keyboard"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }
serde_json = "1"

[dependencies]
# Tauri
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Image decoding (for tray icon)
image = { version = "0.25", default-features = false, features = ["png"] }

# Audio
hound = "3.5"
cpal = "0.15"

# Async
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs"] }

# ZIP creation for debug reports
zip = "2"

# Timestamps
chrono = "0.4"

# Directories
dirs = "5"

# URL encoding
urlencoding = "2"

# Open URLs in browser
open = "5"

# Version comparison for update checks
semver = "1.0"

# SHA256 checksum verification for updates
sha2 = "0.10"

# HTTP client for model downloads
reqwest = { version = "0.12", features = ["stream", "rustls-tls"], default-features = false }

# Stream utilities for async download
futures-util = "0.3"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
macos-private-api = ["tauri/macos-private-api"]

[profile.release]
lto = true
codegen-units = 1
strip = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
block2 = "0.6"
objc2-av-foundation = { version = "0.3.2", features = ["AVCaptureDevice", "AVMediaFormat", "block2"] }
